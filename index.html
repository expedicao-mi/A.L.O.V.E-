<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>A.L.O.V.E.</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="A.L.O.V.E.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#050911">
  <meta name="color-scheme" content="dark">

  <link rel="apple-touch-icon" sizes="180x180" href="./app_icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./app_icon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background-color: #050911;
      color-scheme: dark;
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* Moldura: corta tudo que passar da tela */
    .frame {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background-color: #050911;
    }

    /* Iframe mais alto que a moldura. A barra "Built with Streamlit",
       a coroa e o avatar ficam no fundo do iframe, ou seja,
       fora da área visível. */
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% + 120px);
      border: 0;
      background-color: #050911;
      color-scheme: dark;
    }
  </style>
</head>

<body>
  <div class="frame">
    <iframe
      src="https://expedicao-mi-a-l-o-v-e--app-k4ytmd.streamlit.app/?embed=true&embed_options=dark_theme"
      title="A.L.O.V.E. Painel"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
