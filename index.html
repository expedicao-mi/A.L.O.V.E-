<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>A.L.O.V.E.</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="A.L.O.V.E.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#050911">
  <meta name="color-scheme" content="dark">

  <link rel="apple-touch-icon" sizes="180x180" href="./app_icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./app_icon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background-color: #050911;
      color-scheme: dark;
      overflow: hidden;
      overscroll-behavior: none;
    }

    .frame {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background-color: #050911;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background-color: #050911;
      color-scheme: dark;
    }

    /* Tampa só o canto inferior direito (coroa + avatar do Streamlit).
       pointer-events: none deixa o toque passar para o app. */
        .mask-canto {
      position: fixed;
      right: 0;
      bottom: 0;
      width: 240px;
      height: 150px;
      background: #050911;
      z-index: 10;
      pointer-events: none;
    }

  </style>
</head>

<body>
  <div class="frame">
    <iframe
      src="https://expedicao-mi-a-l-o-v-e--app-k4ytmd.streamlit.app/?embed=true&embed_options=dark_theme"
      title="A.L.O.V.E. Painel"
      allowfullscreen>
    </iframe>
    <div class="mask-canto"></div>
  </div>
</body>
</html>
