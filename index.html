<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>A.L.O.V.E.</title>

  <!-- PWA & Tela Cheia Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="A.L.O.V.E.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a101d">

  <!-- Ícones Oficiais -->
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/cris2026/A.L.O.V.E-/main/logo_alove.png">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/cris2026/A.L.O.V.E-/main/logo_alove.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0a101d;
    }
    
    /* Container que prende a tela e corta qualquer sobra */
    .app-viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0a101d;
    }

    /* Iframe esticado para projetar o rodapé além da viewport */
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% + 55px);
      border: none;
      display: block;
      background-color: #0a101d;
    }
  </style>
</head>
<body>
  <div class="app-viewport">
    <iframe src="https://alove-painel-gestor.streamlit.app/?embed=true"></iframe>
  </div>
</body>
</html>
