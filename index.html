<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>A.L.O.V.E.</title>

  <!-- PWA & Mobile Fullscreen -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="A.L.O.V.E.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a101d">

  <!-- Ícone Oficial A.L.O.V.E. -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/expedicao-mi/A.L.O.V.E-/main/app_icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://raw.githubusercontent.com/expedicao-mi/A.L.O.V.E-/main/app_icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="https://raw.githubusercontent.com/expedicao-mi/A.L.O.V.E-/main/app_icon.png">

  <style>
    * {
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
      border: none !important;
      outline: none !important;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden !important;
      background-color: #0a101d !important;
    }

    .app-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden !important;
      background-color: #0a101d !important;
    }

    iframe {
      position: absolute;
      top: -12px !important;
      left: -12px !important;
      width: calc(100vw + 24px) !important;
      height: calc(100vh + 82px) !important;
      border: 0 !important;
      outline: 0 !important;
      background-color: #0a101d !important;
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <iframe src="https://alove-painel-gestor.streamlit.app/?embed=true" frameborder="0"></iframe>
  </div>
</body>
</html>
