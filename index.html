<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>A.L.O.V.E.</title>

  <!-- PWA e tela cheia no iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="A.L.O.V.E.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#050911">

  <link rel="apple-touch-icon" sizes="180x180" href="./app_icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./app_icon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* TRAVA DEFINITIVA DO ELÁSTICO BRANCO DO IPHONE */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden !important;
      overscroll-behavior: none !important;
      background-color: #050911 !important;
      position: fixed;
      inset: 0;
    }

    .app-wrapper {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden !important;
      overscroll-behavior: none !important;
      background-color: #050911 !important;
    }

    /* O iframe é mais alto que a tela: os ícones do Streamlit
       (coroa, avatar) ficam para fora da área visível. */
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% + 75px);
      border: 0;
      background-color: #050911 !important;
      overscroll-behavior: none !important;
    }
  </style>
</head>

<body>
  <div class="app-wrapper">
    <iframe
      src="https://expedicao-mi-a-l-o-v-e--app-k4ytmd.streamlit.app/?embed=true&embed_options=dark_theme"
      title="A.L.O.V.E. Painel"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
