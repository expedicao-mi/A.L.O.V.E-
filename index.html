<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>A.L.O.V.E.</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="A.L.O.V.E.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#050911">
  <meta name="color-scheme" content="dark">

  <!-- Manifesto PWA obrigatório para instalação nativa no Android -->
  <link rel="manifest" href="./manifest.json">

  <link rel="apple-touch-icon" sizes="180x180" href="./app_icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./app_icon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #050911;
      color-scheme: dark;
      overflow: hidden;
      overscroll-behavior: none;
    }

    .frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      height: 100lvh;
      overflow: hidden;
      background-color: #050911;
    }

        iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100vh + 48px);
      height: calc(100lvh + 48px);
      border: 0;
      background-color: #050911;
      color-scheme: dark;
    }

  </style>
</head>

<body>
  <div class="frame">
    <iframe
      src="https://expedicao-mi-a-l-o-v-e--app-k4ytmd.streamlit.app/?embed=true&embed_options=dark_theme"
      title="A.L.O.V.E. Painel"
      allowfullscreen>
    </iframe>
  </div>

  <!-- Registro do Service Worker obrigatório para o Chrome Android liberar "Instalar app" -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", { scope: "./" })
          .catch((err) => console.warn("SW falhou:", err));
      });
    }
  </script>
</body>
</html>
