<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>A.L.O.V.E.</title>

  <!-- PWA e tela cheia no iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="A.L.O.V.E.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a101d">

  <link rel="apple-touch-icon" sizes="180x180" href="./app_icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./app_icon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a101d;
    }

    .app-wrapper {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #0a101d;
    }

    iframe {
      position: absolute;
      top: -12px;
      left: -12px;
      width: calc(100% + 24px);
      height: calc(100% + 82px);
      border: 0;
      background: #0a101d;
    }

    /* MÁSCARA SUPERIOR */
    .mask-top {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 105px;
      background: #0a101d;
      z-index: 9999;
      pointer-events: none;
    }

    /* MÁSCARA DO CANTO INFERIOR DIREITO */
    .mask-bottom-right {
      position: fixed;
      right: 0;
      bottom: 0;
      width: 110px;
      height: 100px;
      background: #0a101d;
      z-index: 9999;
      pointer-events: none;
    }

    /* Respeita a área segura do iPhone */
    @supports (padding-top: env(safe-area-inset-top)) {
      .mask-top {
        height: calc(env(safe-area-inset-top) + 55px);
      }
    }
  </style>
</head>

<body>
  <div class="app-wrapper">

    <iframe
      src="https://alove-painel-gestor.streamlit.app/?embed=true"
      title="A.L.O.V.E. Painel"
      allowfullscreen>
    </iframe>

    <div class="mask-top"></div>
    <div class="mask-bottom-right"></div>

  </div>
</body>
</html>
